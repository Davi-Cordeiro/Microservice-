{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <header class="border-b border-slate-800/80">
        <div class="max-w-5xl mx-auto px-6 py-6 flex items-center justify-between">
            <span class="text-lg font-semibold">Criação dos Produtos</span>
        </div>
    </header>

    <main class="flex flex-container">
        <div class="mx-auto mt-20">
            <div id="form-feedback" class="mb-4 font-mono text-sm" hidden></div>

            <form method="post" id="cadastro-form">
                {%  csrf_token %}

                {%for field in form %}
                    <div class="mb-4 flex flex-col" data-field="{{ field.name }}">
                        <label for="{{field.id_for_label}}" class="font-mono text-sm  ">
                            {{ field.label }}
                        </label>

                        {{ field }} 

                        <div data-role="field-errors">
                            {% if field.errors %}
                                <p class="font-mono text-red-400 mt-1">{{ field.errors|striptags }}</p>
                            {% endif %}
                        </div>

                    </div>
                {% endfor%}
                <div class="flex flex-col items-center "> 
                    <span id="form-submission-feedback" class="font-mono text-sm"></span>
                    <button type="submit" id="submit-btn" class="group rounded-2xl border border-slate-600 bg-slate-800/60 p-6 transition duration-200 hover:-translate-y-1 hover:border-indigo-500/60 hover:bg-slate-900 py-2 px-4">Enviar</button>
                </div>
            </form>
        </div>
    </main>

    <script src="{% static 'produtos/js/cadastro.js' %}" defer></script>
</body>
</html>
